server:
  # 必须绑回环。0.0.0.0 会让同网段设备直接访问到内核，而内核里有能让 agent
  # 执行本机命令的接口。keeper 是本机单用户应用，没有入站认证——所以这条是
  # 唯一的网络边界，务必保持 127.0.0.1。
  host: 127.0.0.1
  port: 8080
agent:
  name: assistant
workspace:
  kind: local
  root: ~/.keeper/workspace/user
  read_only: false
agent_overrides: {}
# 核心 agent（主脑）：从本地目录构建，不在数据库里。
#   id  —— 它的 agent_id。会话拿这个做归属（点「开始对话」建的会话归它）。
#         必须唯一；改了它，历史会话就认不出现在的主脑了。
#   dir —— 目录位置，里面是 agent.yaml（名字）与 soul.md（人格）。
core_agent:
  id: core
  dir: ~/.keeper/core-agent
# 用户设置（A2A 超时/熔断、prompt 落盘、上下文治理）不写在这里：
# 见 ~/.keeper/settings.yaml——那里的值覆盖本文件同名段，改完立即生效。
# 本文件是元配置，只在部署时手改。

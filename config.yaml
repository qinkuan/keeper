server:
  # 必须绑回环。0.0.0.0 会让同网段设备直接访问到内核，而内核里有能让 agent
  # 执行本机命令的接口。keeper 是本机单用户应用，没有入站认证——所以这条是
  # 唯一的网络边界，务必保持 127.0.0.1。
  host: 127.0.0.1
  # 首选端口。**0 = 由系统分配一个空闲端口**（推荐）：用户机器上 8080 很可能
  # 早被别的程序占着，写死就起不来——或者更糟，起了个服务却连到了别人的服务上。
  # 填了具体数字时优先用它，被占用则自动换一个。
  # 实际端口写进 ~/.keeper/runtime/kernel.json，脚本与前端代理从那儿读。
  port: 0
# 核心 agent（主脑）：从本地目录构建，不在数据库里。
#   id  —— 它的 agent_id。会话拿这个做归属（点「开始对话」建的会话归它）。
#         必须唯一；改了它，历史会话就认不出现在的主脑了。
#   dir —— 目录位置，里面是 agent.yaml（名字）与 soul.md（人格）。
core_agent:
  id: core
  dir: ~/.keeper/core-agent
# 用户设置（A2A 超时/熔断、prompt 落盘、上下文治理、「我的空间」路径）不写在这里：
# 见 ~/.keeper/settings.yaml——那里的值覆盖本文件同名段，改完立即生效。
# 本文件是元配置，只在部署时手改。
#
# 「我的空间」放在 settings.yaml 而不在这里：它是**用户自己的目录**，属于
# 「用的时候改」，而本文件是「部署时定、跟代码走」。见 keeper/setting/user_settings.py。
